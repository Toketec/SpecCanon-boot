<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型: {页面名称}</title>
  <!-- 纯 HTML 原型 — 不需要框架、后端、真实数据 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); overflow: hidden; }
    /* ========== 组件样式 ========== */
    .header { padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
    .content { padding: 16px; }
    .btn { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; font-size: 16px; cursor: pointer; border: none; }
    .btn-primary { background: #4F46E5; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .card { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
    .input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    /* ========== 交互状态 ========== */
    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .error-state { text-align: center; padding: 60px 20px; color: #EF4444; }
    .loading { text-align: center; padding: 40px; }
    /* ========== 动画 ========== */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .page { animation: fadeIn .3s ease; }
  </style>
</head>
<body>
  <div class="container page">
    <!-- ====== 原型内容 ====== -->
    <div class="header">
      <span style="font-weight:600;">{页面标题}</span>
      <!-- 导航/操作按钮 -->
    </div>

    <div class="content">
      <!-- 在此放置组件演示 -->
      <p style="color:#999;text-align:center;padding:40px 0;">{交互说明}</p>
    </div>
  </div>

  <script>
    // ========== 交互脚本（纯演示，无后端） ==========
    // 点击、切换、弹窗等交互在此实现
  </script>
</body>
</html>
